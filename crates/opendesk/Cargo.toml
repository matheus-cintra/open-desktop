[package]
name = "opendesk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "opendesk"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts"] }
opendesk-proto = { workspace = true }
opendesk-core = { workspace = true }
opendesk-platform.workspace = true
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rust-i18n = { workspace = true }
mdns-sd = { workspace = true }

toml = { workspace = true }
notify = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
opendesk-wayland.workspace = true
zbus.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
opendesk-macos.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
opendesk-wayland = { workspace = true, features = ["test-harness"] }
