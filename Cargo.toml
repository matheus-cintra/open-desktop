[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0-alpha.1"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
opendesk-proto = { path = "crates/opendesk-proto" }
opendesk-core = { path = "crates/opendesk-core" }
opendesk-platform = { path = "crates/opendesk-platform" }
opendesk-macos = { path = "crates/opendesk-macos" }
opendesk-wayland = { path = "crates/opendesk-wayland" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1.1", features = ["use-std"] }
thiserror = "2"
anyhow = "1"
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "1"
clap = { version = "4.6", features = ["derive"] }
rust-i18n = "4"
sha2 = "0.11"
rand = "0.10"
uuid = { version = "1", features = ["v4"] }
dirs = "7"
notify = "9.0.0-rc.5"
mdns-sd = "0.21"
zbus = { version = "5", default-features = false, features = ["tokio"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
smithay-client-toolkit = "0.21"
calloop = "0.14"
calloop-wayland-source = "0.4"
xkbcommon = "0.9"
memmap2 = "0.9"
rustix = { version = "1", features = ["fs", "mm"] }
tiny-skia = "0.12"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
